name: Real-model ranking benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/shortlist-benchmark.db
      APP_ENV: test
      PRELOAD_MODEL: '0'
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
      - name: Run the frozen challenge set with actual embeddings
        run: python -m evaluation.run --output /tmp/ranking-benchmark.json
      - name: Add results to the run summary
        run: cat /tmp/ranking-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: real-model-ranking-benchmark
          path: /tmp/ranking-benchmark.*
          retention-days: 30
